name: MCQ Auto Generation

concurrency:
  group: mcq-auto-generation
  cancel-in-progress: false

permissions:
  contents: read

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Run Generator
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          DEEPSEEK_KEYS: ${{ secrets.DEEPSEEK_KEYS }}
          TASKS_PER_RUN: '3'
          MCQS_PER_CHAPTER: '10'
          MCQ_QUALITY_GATE: '90'
          MCQ_AUTO_APPROVE_TIER: '1'
          MCQ_AUTO_APPROVE_MIN_SCORE: '93'
          MCQ_MAX_SAVE_RATE: '0.15'
          RUN_PYQ_INGEST: ${{ github.event.schedule == '0 3 * * 0' && '1' || '0' }}
        run: node scripts/generate.js
